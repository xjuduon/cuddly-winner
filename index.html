<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>✨ 流星雨 · 许愿池</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #05070f;
            font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
            touch-action: none; /* 防止手机滑动页面 */
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 顶部标题装饰 */
        .title {
            position: fixed;
            top: 8%;
            left: 0;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.65);
            font-size: clamp(16px, 4vw, 24px);
            letter-spacing: 6px;
            font-weight: 300;
            z-index: 2;
            pointer-events: none;
            text-shadow: 0 0 20px rgba(120, 180, 255, 0.6);
            animation: glow 3s infinite alternate ease-in-out;
        }

        @keyframes glow {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* 底部提示 */
        .hint {
            position: fixed;
            bottom: 6%;
            left: 0;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.35);
            font-size: clamp(12px, 3vw, 15px);
            letter-spacing: 3px;
            z-index: 2;
            pointer-events: none;
            animation: hintPulse 2.5s infinite alternate ease-in-out;
        }

        @keyframes hintPulse {
            0% { opacity: 0.3; }
            100% { opacity: 0.8; }
        }
    </style>
</head>
<body>
    <canvas id="sky"></canvas>
    <div class="title">星 河 入 梦</div>
    <div class="hint">轻触屏幕 · 流星许愿</div>

    <script>
        (function() {
            const canvas = document.getElementById('sky');
            const ctx = canvas.getContext('2d');

            // ========== 全局尺寸 ==========
            let W = 0, H = 0;
            let dpr = Math.min(window.devicePixelRatio || 1, 2); // 限制最大2倍，保证性能

            function resize() {
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = W * dpr;
                canvas.height = H * dpr;
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                initStars();
            }

            // ========== 静态星空背景（闪烁的小星星） ==========
            let stars = [];
            const STAR_COUNT = 160;

            function initStars() {
                stars = [];
                for (let i = 0; i < STAR_COUNT; i++) {
                    stars.push({
                        x: Math.random() * W,
                        y: Math.random() * H * 0.9,   // 上方90%区域
                        r: Math.random() * 1.4 + 0.3,
                        alpha: Math.random() * 0.6 + 0.2,
                        twinkleSpeed: Math.random() * 0.015 + 0.005,
                        phase: Math.random() * Math.PI * 2
                    });
                }
            }

            function drawStars(t) {
                for (let i = 0; i < stars.length; i++) {
                    const s = stars[i];
                    // 闪烁：用正弦改变透明度
                    const a = s.alpha * (0.6 + 0.4 * Math.sin(t * s.twinkleSpeed + s.phase));
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 240, ${a})`;
                    ctx.fill();
                }
            }

            // ========== 流星 ==========
            const meteors = [];
            const MAX_METEORS = 70;      // 屏幕同时存在上限
            const AUTO_SPAWN_RATE = 0.06; // 每帧自然生成概率

            class Meteor {
                constructor(customX, customY) {
                    this.init(customX, customY);
                }

                init(customX, customY) {
                    // 方向：从右上到左下，角度约 130°~160°
                    this.angle = (Math.random() * 0.5 + 2.4); // 2.4 ~ 2.9 弧度
                    
                    // 速度
                    this.speed = Math.random() * 6 + 6;

                    // 尾巴长度
                    this.length = Math.random() * 180 + 150;

                    // 起点位置：默认从屏幕外进入
                    if (customX !== undefined && customY !== undefined) {
                        this.x = customX;
                        this.y = customY;
                    } else {
                        // 随机在屏幕右上方或上方区域外生成
                        if (Math.random() < 0.6) {
                            // 从右侧外进入
                            this.x = W + 100 + Math.random() * 200;
                            this.y = Math.random() * H * 0.6;
                        } else {
                            // 从顶部外进入
                            this.x = W * (0.2 + Math.random() * 0.8);
                            this.y = -100 - Math.random() * 200;
                        }
                    }

                    // 头部亮度
                    this.brightness = Math.random() * 0.4 + 0.7;

                    // 头部大小
                    this.headSize = Math.random() * 1.5 + 1.2;

                    // 尾巴粗细
                    this.tailWidth = Math.random() * 1.5 + 0.8;

                    // 生命值，用于控制渐隐
                    this.life = 1;
                    
                    // 颜色：偏蓝、白、紫、淡粉
                    const hue = 190 + Math.random() * 90;  // 190~280
                    this.color = `hsl(${hue}, 80%, 85%)`;

                    // 透明度调整系数
                    this.alpha = 1;
                }

                update() {
                    const vx = Math.cos(this.angle) * this.speed;
                    const vy = Math.sin(this.angle) * this.speed;
                    this.x += vx;
                    this.y += vy;

                    // 如果完全离开屏幕（左下），则标记为无效
                    if (this.x < -this.length || this.y > H + this.length) {
                        this.life = 0;
                    }
                    // 到达屏幕边缘后开始淡出（更自然）
                    if (this.x < 100 || this.y > H - 100) {
                        this.alpha -= 0.02;
                    }
                    if (this.alpha < 0) this.alpha = 0;
                }

                draw() {
                    if (this.alpha <= 0.01) return;

                    const rad = this.angle;
                    // 尾巴终点（反方向）
                    const tailX = this.x - Math.cos(rad) * this.length;
                    const tailY = this.y - Math.sin(rad) * this.length;

                    // 渐变：头亮尾暗
                    const grad = ctx.createLinearGradient(this.x, this.y, tailX, tailY);
                    grad.addColorStop(0, `rgba(255, 255, 255, ${this.brightness * this.alpha})`);
                    grad.addColorStop(0.15, `rgba(200, 230, 255, ${this.brightness * 0.9 * this.alpha})`);
                    grad.addColorStop(0.5, `rgba(160, 200, 255, ${this.brightness * 0.5 * this.alpha})`);
                    grad.addColorStop(1, `rgba(100, 150, 255, 0)`);

                    // 绘制尾巴（线条）
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(tailX, tailY);
                    ctx.strokeStyle = grad;
                    ctx.lineWidth = this.tailWidth;
                    ctx.lineCap = 'round';
                    ctx.stroke();

                    // 绘制头部光晕
                    ctx.beginPath();
                    const glowRadius = this.headSize * 6;
                    const glowGrad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, glowRadius);
                    glowGrad.addColorStop(0, `rgba(255, 255, 255, ${this.brightness * this.alpha})`);
                    glowGrad.addColorStop(0.4, `rgba(180, 210, 255, ${this.brightness * 0.5 * this.alpha})`);
                    glowGrad.addColorStop(1, 'rgba(120, 160, 255, 0)');
                    ctx.fillStyle = glowGrad;
                    ctx.arc(this.x, this.y, glowRadius, 0, Math.PI * 2);
                    ctx.fill();

                    // 头部亮核
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.headSize, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${this.brightness * this.alpha})`;
                    ctx.shadowColor = 'white';
                    ctx.shadowBlur = 12;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }

            // ========== 许愿文字 ==========
            const wishes = [];
            const WISH_WORDS = [
                '平安喜乐', '万事胜意', '前程似锦', '心想事成', '未来可期',
                '岁岁平安', '得偿所愿', '不负韶华', '星河滚烫', '所念皆星河',
                '暴富暴瘦', '一夜好梦', '所行皆坦途', '喜乐长安', '诸事顺遂',
                '愿有人陪你颠沛流离', '愿你眼里有光', '所遇皆温柔', '一生温暖',
                '愿所有美好如期而至', '山河远阔', '人间烟火', '发光发亮',
                '一切顺利', '诸事皆宜', '万事顺意', '永远开心'
            ];

            class Wish {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.text = WISH_WORDS[Math.floor(Math.random() * WISH_WORDS.length)];
                    this.life = 1;
                    this.decay = Math.random() * 0.005 + 0.006;
                    this.vy = -(Math.random() * 0.8 + 0.6); // 上升速度
                    this.vx = (Math.random() - 0.5) * 0.5; // 轻微水平漂移
                    this.fontSize = Math.random() * 8 + 18; // 18~26
                    this.hue = 35 + Math.random() * 40; // 金色到淡橙
                }

                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.life -= this.decay;
                    if (this.life <= 0) this.life = 0;
                }

                draw() {
                    if (this.life <= 0) return;
                    const a = Math.min(this.life, 1);
                    ctx.save();
                    ctx.font = `300 ${this.fontSize}px 'PingFang SC', 'Microsoft YaHei', sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    
                    // 光晕
                    ctx.shadowColor = `hsla(${this.hue}, 100%, 70%, ${a * 0.9})`;
                    ctx.shadowBlur = 24;

                    // 渐变填充
                    const grad = ctx.createLinearGradient(this.x, this.y - 15, this.x, this.y + 15);
                    grad.addColorStop(0, `hsla(${this.hue}, 100%, 92%, ${a})`);
                    grad.addColorStop(1, `hsla(${this.hue}, 100%, 60%, ${a})`);
                    ctx.fillStyle = grad;
                    ctx.fillText(this.text, this.x, this.y);
                    ctx.restore();
                }
            }

            // ========== 主动画循环 ==========
            let globalTime = 0;

            function animate() {
                globalTime += 0.016; // 近似时间增量，用于闪烁

                // 1. 清屏（使用半透明遮罩产生拖尾效果，但我们的流星已自带拖尾，所以清屏要干净）
                // 为了使流星尾迹更柔和，我们用带有透明度的黑色矩形清屏（比 clearRect 更有拖尾感）
                // 但如果用半透明黑，背景星星也会变暗，所以权衡后还是用 clearRect 保证星星清晰。
                ctx.clearRect(0, 0, W, H);

                // 2. 绘制闪烁的静态星星
                drawStars(globalTime);

                // 3. 自然生成流星
                if (meteors.length < MAX_METEORS && Math.random() < AUTO_SPAWN_RATE) {
                    meteors.push(new Meteor());
                }

                // 4. 更新 + 绘制 流星
                for (let i = meteors.length - 1; i >= 0; i--) {
                    const m = meteors[i];
                    m.update();
                    if (m.life <= 0) {
                        meteors.splice(i, 1);
                        continue;
                    }
                    m.draw();
                }

                // 5. 更新 + 绘制 许愿文字
                for (let i = wishes.length - 1; i >= 0; i--) {
                    const w = wishes[i];
                    w.update();
                    if (w.life <= 0) {
                        wishes.splice(i, 1);
                        continue;
                    }
                    w.draw();
                }

                requestAnimationFrame(animate);
            }

            // ========== 点击事件：爆发流星 + 许愿文字 ==========
            function handleTap(e) {
                let tapX, tapY;
                if (e.touches && e.touches[0]) {
                    tapX = e.touches[0].clientX;
                    tapY = e.touches[0].clientY;
                } else {
                    tapX = e.clientX;
                    tapY = e.clientY;
                }

                // 生成许愿文字（从点击位置）
                wishes.push(new Wish(tapX, tapY));
                if (wishes.length > 25) wishes.splice(0, wishes.length - 25); // 防止过多

                // 爆发流星：从点击位置附近生成
                const burst = 6 + Math.floor(Math.random() * 5);
                for (let i = 0; i < burst; i++) {
                    if (meteors.length < MAX_METEORS + 20) {
                        const offsetX = (Math.random() - 0.5) * 120;
                        const offsetY = (Math.random() - 0.5) * 120;
                        meteors.push(new Meteor(tapX + offsetX, tapY + offsetY));
                    }
                }
            }

            // ========== 启动 ==========
            function start() {
                resize();
                // 预先填充一些流星，让页面一打开就有流星雨的感觉
                for (let i = 0; i < 20; i++) {
                    meteors.push(new Meteor());
                }
                
                // 绑定点击/触摸事件（移动端使用 touchstart，PC 使用 click）
                window.addEventListener('touchstart', function(e) {
                    // 防止双击缩放
                    e.preventDefault();
                    handleTap(e);
                }, { passive: false });
                
                window.addEventListener('click', handleTap);

                // 窗口大小变化
                window.addEventListener('resize', resize);

                // 开始动画
                animate();
            }

            // 确保页面加载完成后启动
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', start);
            } else {
                start();
            }
        })();
    </script>
</body>
</html>
